<!DOCTYPE html>
<html>
<head><title>Quiz Mark Validator</title></head>
<body>
  <input type="number" id="markInput" placeholder="Enter quiz mark (0-10)">
  <button id="submitBtn" onclick="validateMark()">Submit</button>
  <p id="result"></p>

  <script>
    function validateMark() {
      const val = document.getElementById("markInput").value;
      const num = Number(val);
      if (val !== "" && Number.isInteger(num) && num >= 0 && num <= 10) {
        document.getElementById("result").innerText = "Accepted";
      } else {
        document.getElementById("result").innerText = "Rejected";
      }
    }
  </script>
</body>
</html>
